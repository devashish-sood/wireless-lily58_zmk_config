# Left: battery + Luna dog. Right: standard nice!view screen.
---
include:
  - board: blelulu_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    shield: lulu_dog
  - board: blelulu_right
    shield: nice_view

  # Uncomment the following to build a "settings reset" firmware
  # to clear persistent settings (bluetooth connections, etc).
  # - board: blelulu_left
  #   shield: settings_reset
  # - board: blelulu_right
  #   shield: settings_reset

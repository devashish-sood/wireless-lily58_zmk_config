# Walkies: status on the left, dog and landscape on the right.
---
include:
  - board: blelulu_left
    snippet: studio-rpc-usb-uart;zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    shield: walkies
  - board: blelulu_right
    shield: walkies

  # Uncomment the following to build a "settings reset" firmware
  # to clear persistent settings (bluetooth connections, etc).
  # - board: blelulu_left
  #   shield: settings_reset
  # - board: blelulu_right
  #   shield: settings_reset

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096

# Match the working nice!view shield's monochrome rendering configuration.
CONFIG_LV_Z_BITS_PER_PIXEL=1
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_MONOCHROME_CONVERSION_BUFFER=y
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161

# Full-screen canvas rendering needs more headroom than the old small tiles.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
